# Conventional commits on main -> a release PR; merging it tags vX.Y.Z (the ref Copier scaffolds from)
# and bumps package.json, the marketplace and every plugin manifest together.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITOPS_TOKEN || github.token }}
          target-branch: main
