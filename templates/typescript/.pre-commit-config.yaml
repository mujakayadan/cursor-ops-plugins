# Run with prek (https://prek.j178.dev): `pnpm exec prek run --all-files`.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
        exclude: ^tsconfig\.json$
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: biome
        name: biome check
        entry: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css]
      - id: typecheck
        name: tsc
        entry: pnpm run typecheck
        language: system
        pass_filenames: false
        types_or: [ts, tsx]
      - id: vitest
        name: vitest
        entry: pnpm run test
        language: system
        pass_filenames: false
        stages: [pre-push]
